# 東石診股：回補指定基金的近兩年歷史淨值（清單在 data/funds/backfill.txt）
name: 基金歷史淨值回補

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/funds/backfill.txt", "tools/fund_backfill.py", ".github/workflows/fund-backfill.yml"]

permissions:
  contents: write

concurrency:
  group: fund-nav
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 先更新基金清單（取得查詢需要的機構代碼）
        run: python tools/fund_nav.py
      - name: 回補歷史淨值
        run: python tools/fund_backfill.py
      - name: 存回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -q -m "基金歷史淨值回補 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
