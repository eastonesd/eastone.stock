# 東石診股：每天收集境內外基金淨值（來源只給最近幾天，所以要天天存才會有歷史）
name: 基金淨值每日收集

on:
  schedule:
    # 台灣時間 10:17、18:17、23:47（重複抓沒關係，同一天的淨值只會存一次）
    - cron: "17 2 * * *"
    - cron: "17 10 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fund-nav.yml", "tools/fund_nav.py", "tools/insurer_accounts.json"]

permissions:
  contents: write

concurrency:
  group: fund-nav
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取、累積淨值與配息，存回儲存庫
        # 每次都從最新的 main 開始；存檔時若別的排程剛好也更新了，就重新抓一次再存（程式重跑不會重複寫入）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/fund_nav.py
            git add data/funds
            if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
            git commit -q -m "基金淨值更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push -q origin HEAD:main && exit 0
            echo "推送衝突，重來一次"; sleep 10
          done
          exit 1
